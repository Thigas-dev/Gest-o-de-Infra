<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Infra</title>
    <link rel="stylesheet" href="/styles/style.css">
    <script src="/script/script.js" defer></script>
    <!-- Biblioteca Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Favicon padrão -->
    <link rel="icon" href="/img/icon/favicon.ico" type="image/x-icon">

    <!-- Ícone para dispositivos Apple -->
    <link rel="apple-touch-icon" href="/img/icon/apple-touch-icon.webp">

    <!-- WEBP (navegadores modernos) -->
    <link rel="icon" type="image/webp" sizes="32x32" href="/img/icon/favicon-32x32.webp">
    <link rel="icon" type="image/webp" sizes="16x16" href="/img/icon/favicon-16x16.webp">

    <!-- Manifest (opcional, mas recomendado) -->
    <link rel="manifest" href="img/icon/site.webmanifest">
</head>

<body>

    <div class="sidebar">
        <div class="logo">
            <!-- O style="width: 40px; height: auto;" trava o tamanho da imagem. 
             Você pode aumentar ou diminuir o 40px conforme precisar. -->
            <img src="/img/fotos/logo.png" alt="Logo Portal Infra"
                style="width: 40px; height: auto; margin-right: 10px;">
            Portal Infra Honcord
        </div>
        <!-- Trocamos <div> por <a> e adicionamos o link no href -->
        <a href="/pages/index.html" class="nav-item active">Dashboard</a>
        <a href="/pages/impressoras.html" class="nav-item">Ativos (Impressoras)</a>
        <a href="/pages/switches.html" class="nav-item">Switches & Portas</a>
        <a href="/pages/relatorios.html" class="nav-item">Relatórios</a>
    </div>
    </div>

    <div class="main-content">
        <div class="header-action">
            <h1>Gestão de Infraestrutura</h1>
        </div>

        <div class="stats-grid">
            <div class="glass-card stat-card">
                <div class="stat-value" style="color: var(--tertiary);" id="count-na-rede">0</div>
                <div class="stat-label">Impressoras Na Rede</div>
            </div>
            <div class="glass-card stat-card secondary">
                <div class="stat-value" style="color: var(--neutral);">8</div>
                <div class="stat-label">Switches Mapeados</div>
            </div>
            <div class="glass-card stat-card alert">
                <div class="stat-value" style="color: var(--primary);" id="count-reserva">0</div>
                <div class="stat-label">Ativos em Reserva</div>
            </div>
        </div>

        <div class="dashboard-charts">
            <!-- Gráfico de Rosca: Distribuição de Marcas -->
            <div class="glass-card chart-container">
                <h3>Distribuição por Fabricante</h3>
                <div style="position: relative; height: 250px; width: 100%; display: flex; justify-content: center;">
                    <canvas id="chartMarcas"></canvas>
                </div>
            </div>

            <!-- Gráfico de Barras: Status do Parque -->
            <div class="glass-card chart-container">
                <h3>Status Impressoras</h3>
                <div style="position: relative; height: 250px; width: 100%;">
                    <canvas id="chartStatus"></canvas>
                </div>
            </div>
        </div>
</body>

</html>

</html>
