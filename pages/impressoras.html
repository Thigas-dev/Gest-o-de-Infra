<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Infra - Impressoras</title>
    
    <link rel="stylesheet" href="/styles/impressoras.css">
    <script src="/script/imp.js" defer></script>

    <!-- Ícones -->
    <link rel="icon" href="/img/icon/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="/img/fotos/logo.png" alt="Logo Portal Infra" style="width: 40px; height: auto; margin-right: 10px;">
            Portal Infra Honcord
        </div>
        
        <a href="/pages/index.html" class="nav-item">Dashboard</a>
        <a href="/pages/impressoras.html" class="nav-item active">Ativos (Impressoras)</a>
        <a href="/pages/switches.html" class="nav-item">Switches & Portas</a>
        <a href="/pages/relatorios.html" class="nav-item">Relatórios</a>
    </div>

    <!-- CONTEÚDO PRINCIPAL FOCADO EM GERENCIAMENTO -->
    <div class="main-content">
        <div class="header-action">
            <h1>Inventário de Impressoras</h1>
            <button class="btn-primary" onclick="openModal()">+ Novo Mapeamento</button>
        </div>

        <div class="assets-header">
            <input type="text" class="search-bar" id="searchInput"
                placeholder="Pesquisar por IP, Hostname, Modelo ou Serial..." onkeyup="filterCards()" style="width: 100%; max-width: 600px;">
        </div>

        <!-- Grid exclusivo para as impressoras -->
        <div class="printers-grid" id="printersGrid"></div>
    </div>

    <!-- MODAL DE CADASTRO MANTIDO IGUAL -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Equipamento</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="addForm" onsubmit="saveEquipamento(event)">
                <div class="form-group">
                    <label>Hostname</label>
                    <input type="text" id="formHost" required placeholder="Ex: Imp-Recepcao">
                </div>
                <div class="form-group">
                    <label>Endereço IP</label>
                    <input type="text" id="formIp" required placeholder="Ex: 10.0.2.x">
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Fabricante</label>
                        <select id="formMarca" required>
                            <option value="">Selecione...</option>
                            <option value="BROTHER">BROTHER</option>
                            <option value="OKI">OKI</option>
                            <option value="ZEBRA">ZEBRA</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Modelo</label>
                        <input type="text" id="formModelo" required placeholder="Ex: DCP-L5652DN">
                    </div>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 2;">
                        <label>Serial</label>
                        <input type="text" id="formSerial" required placeholder="Ex: U64198L7N608948">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Status</label>
                        <select id="formStatus">
                            <option value="Na Rede">Na Rede</option>
                            <option value="Reserva">Reserva</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar no Banco</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
