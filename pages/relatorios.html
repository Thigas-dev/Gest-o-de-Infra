<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Infra - Relatórios</title>

    <!-- Usando o mesmo CSS principal dos switches para manter o padrão -->
    <link rel="stylesheet" href="/styles/switches.css">
    <script src="/script/relatorios.js" defer></script>

    <!-- Ícones -->
    <link rel="icon" href="/img/icon/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <img src="/img/fotos/logo.png" alt="Logo Portal Infra"
                style="width: 40px; height: auto; margin-right: 10px;">
            Portal Infra Honcord
        </div>

        <a href="/pages/index.html" class="nav-item">Dashboard</a>
        <a href="/pages/impressoras.html" class="nav-item">Ativos (Impressoras)</a>
        <a href="/pages/switches.html" class="nav-item">Switches & Portas</a>
        <a href="/pages/telefones.html" class="nav-item">Telefones</a>
        <a href="/pages/relatorios.html" class="nav-item active">Relatórios</a>
    </div>

    <div class="main-content">
        <div class="header-action">
            <h1>Relatório Geral de Conexões</h1>
            <button class="btn-export" onclick="exportarExcel()">Exportar para Excel</button>
        </div>

        <!-- Filtros Rápidos -->
        <div class="assets-header" style="gap: 15px;">
            <input type="text" class="search-bar" id="searchReport" placeholder="Pesquisar por equipamento, switch, porta..." style="flex: 2;" onkeyup="filtrarTabela()">
            <select class="search-bar" id="filterStatus" style="flex: 1;" onchange="filtrarTabela()">
                <option value="">Todos os Status</option>
                <option value="Ativo">Apenas Ativos</option>
                <option value="Inativo/Defeito">Com Defeito</option>
                <option value="Fibra/Internet">Links de Fibra</option>
            </select>
        </div>

        <!-- Tabela de Dados -->
        <div class="report-container">
            <table class="report-table">
                <thead>
                    <tr>
                        <th>Switch</th>
                        <th>Porta SW</th>
                        <th>Patch Panel</th>
                        <th>Porta PP</th>
                        <th>Dispositivo Conectado</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tabelaRelatorio">
                    <!-- Linhas injetadas via JS -->
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
