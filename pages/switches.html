<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Infra - Switches e Portas</title>

    <link rel="stylesheet" href="/styles/switches.css">
    <script src="/script/switches.js" defer></script>

    <!-- Ícones -->
    <link rel="icon" href="/img/icon/favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="sidebar">
        <div class="logo">
            <img src="/img/fotos/logo.png" alt="Logo Portal Infra"
                style="width: 40px; height: auto; margin-right: 10px;">
            Portal Infra Honcord
        </div>

        <a href="/pages/index.html" class="nav-item">Dashboard</a>
        <a href="/pages/impressoras.html" class="nav-item">Ativos (Impressoras)</a>
        <a href="/pages/switches.html" class="nav-item active">Switches & Portas</a>
        <a href="/pages/relatorios.html" class="nav-item">Relatórios</a>
    </div>

    <!-- CONTEÚDO PRINCIPAL FOCADO EM GERENCIAMENTO DE REDE -->
    <div class="main-content">
        <div class="header-action">
            <h1>Mapeamento de Switches</h1>
            <div>
                <!-- Novo Botão para Ocultar/Exibir -->
                <button class="btn-outline" style="margin-right: 15px;" onclick="toggleCabos()">Exibir Cabos</button>
                <button class="btn-primary" onclick="openModal()">+ Nova Conexão</button>
            </div>
        </div>

        <!-- Grid exclusivo para os switches (Rack Virtual) -->
        <div class="rack-container" style="position: relative;">

            <!-- CAMADA INVISÍVEL ONDE OS CABOS SERÃO DESENHADOS -->
            <svg id="camadaCabos"></svg>

            <div class="rack-unit">
                <div class="ru-label">01 U</div>
                <div class="hardware-switch">
                    <div class="hardware-header">
                        <span class="hw-brand">USW-LOTE</span>
                    </div>
                    <div class="ports-panel" id="switchPortsPanel">
                        <!-- Portas via JS -->
                    </div>
                </div>
            </div>

            <!-- Patch Panel Físico -->
            <div class="rack-unit">
                <div class="ru-label">02 U</div>
                <div class="hardware-switch patch-panel">
                    <div class="hardware-header">
                        <span class="hw-model">Patch Panel 01</span>
                    </div>
                    <div class="ports-panel" id="patchPanelPorts">
                        <!-- Portas via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CADASTRO ADAPTADO PARA SWITCHES -->
    <div class="modal-overlay" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Mapear Nova Porta</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="addForm" onsubmit="saveEquipamento(event)">

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 2;">
                        <label>Nome do Switch</label>
                        <input type="text" id="formSwitchName" required placeholder="Ex: MATRIZ-01">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Porta (Switch)</label>
                        <input type="number" id="formSwitchPort" required placeholder="Ex: 24">
                    </div>
                </div>

                <div class="form-group">
                    <label>Dispositivo Conectado</label>
                    <input type="text" id="formConnectedDevice" required placeholder="Ex: Imp-Faturamento ou PC 05">
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Patch Panel (PP)</label>
                        <input type="number" id="formPatchPanel" placeholder="Ex: 1">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Porta do PP (PT)</label>
                        <input type="number" id="formPatchPort" placeholder="Ex: 12">
                    </div>
                </div>

                <div class="form-group">
                    <label>Status da Porta</label>
                    <select id="formStatus">
                        <option value="Ativo">Ativa</option>
                        <option value="Inativo/Defeito">Inativa/Defeito</option>
                        <option value="Fibra/Internet">Fibra/Internet</option>
                    </select>
                </div>

                <div class="modal-footer">
                    <!-- Botão de Excluir adicionado e oculto por padrão -->
                    <button type="button" class="btn-outline" id="btnExcluir"
                        style="display: none; border-color: var(--primary); color: var(--primary);"
                        onclick="excluirConexao()">Excluir</button>

                    <button type="submit" class="btn-primary">Salvar no Banco</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
